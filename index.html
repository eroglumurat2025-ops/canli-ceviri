<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2346d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Canlı Çeviri">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Canlı Çeviri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one-screen phone app — header, scrolling conversation feed, sticky composer at the bottom */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --ink: #141a2b;
  --muted: #5d6680;
  --line: #dde2ec;
  --me: #2346d8;
  --me-soft: #e6ebff;
  --them: #b4570f;
  --them-soft: #fbeedd;
  --danger: #b3261e;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1320; --surface: #181e30; --ink: #e9ecf5; --muted: #9aa3bd; --line: #2a3250;
    --me: #8ea2ff; --me-soft: #1f2a55; --them: #f0a35e; --them-soft: #3a2a1a; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1320; --surface: #181e30; --ink: #e9ecf5; --muted: #9aa3bd; --line: #2a3250;
  --me: #8ea2ff; --me-soft: #1f2a55; --them: #f0a35e; --them-soft: #3a2a1a; --danger: #ff8a80;
  color-scheme: dark;
}
html { font-size: calc(23px * var(--scale, 1) * var(--fit, 1)); }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.45;
  display: flex; flex-direction: column;
}
.wrap { width: 100%; max-width: calc(720px * var(--fit, 1)); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
header { padding-block: 14px 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.hbtns { display: flex; flex-wrap: wrap; gap: 6px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--me); }
.unsure { color: #b45309; font-size: 0.85rem; font-weight: 600; }
@media (prefers-color-scheme: dark) { .unsure { color: #fbbf24; } }
.costbar { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--muted, #555); font: inherit; font-size: 0.85rem; padding: 4px 16px 6px; cursor: pointer; }
.icon-btn { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 0.9rem; cursor: pointer; }
.icon-btn:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--me); outline-offset: 2px; }

#feed { flex: 1; overflow-y: auto; padding-block: 8px 16px; display: flex; flex-direction: column; gap: 12px; }
.empty-note { color: var(--muted); font-size: 1rem; text-align: center; padding: 4px 0; }
.bubble { max-width: 88%; border-radius: 16px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bubble.me { align-self: flex-end; background: var(--me-soft); border-bottom-right-radius: 4px; }
.bubble.them { align-self: flex-start; background: var(--them-soft); border-bottom-left-radius: 4px; }
.bubble .meta { font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.bubble .meta b { color: var(--me); font-weight: 700; }
.bubble.them .meta b { color: var(--them); }
.bubble .orig { color: var(--muted); font-size: 1rem; overflow-wrap: anywhere; }
.bubble .tr { font-size: 1.4rem; font-weight: 700; overflow-wrap: anywhere; white-space: pre-wrap; }
.bubble .tr.pending { color: var(--muted); font-weight: 400; font-style: italic; }
.bubble .tr.err { color: var(--danger); font-size: 0.95rem; font-weight: 400; }
.bubble .acts { display: flex; gap: 6px; margin-top: 2px; }
.bubble .acts button { background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 0.95rem; cursor: pointer; }
.timing { text-transform: none; letter-spacing: 0; }
.sample-tag { background: var(--line); color: var(--muted); border-radius: 999px; padding: 1px 8px; font-size: 0.65rem; }

.composer { background: var(--surface); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.langs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.langs label { display: flex; flex-direction: column; gap: 2px; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.langs label.me-l { color: var(--me); }
.langs label.them-l { color: var(--them); }
select { font: inherit; font-size: 1rem; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
#swap { font-size: 1.2rem; padding: 8px 12px; align-self: end; }
.inputrow { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; }
textarea { flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: none; min-height: 2.6rem; max-height: 8rem; box-sizing: border-box; }
.round { width: min(3rem, 16vw); height: min(3rem, 16vw); border-radius: 50%; border: none; cursor: pointer; font-size: min(1.4rem, 7.5vw); display: grid; place-items: center; flex: none; }
#mic { background: var(--them-soft); color: var(--them); }
#mic.on { background: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
#send { background: var(--me); color: var(--surface); }
@keyframes pulse { 50% { transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { #mic.on { animation: none; } }
.toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 0.95rem; color: var(--muted); }
.toggles label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.toggles input { width: 1.2rem; height: 1.2rem; flex: none; }
.setgroup { margin: 14px 0 0; padding-top: 14px; border-top: 1px solid var(--line); justify-content: flex-start; flex-direction: column; align-items: flex-start; }
.hint { font-size: 0.95rem; color: var(--muted); margin-top: 6px; }
.hint.warn { color: var(--danger); }
.hint.listening { color: var(--ink); font-weight: 700; font-size: 1.05rem; }

dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); padding: 18px; width: min(92vw, calc(440px * var(--fit, 1))); box-sizing: border-box; }
dialog::backdrop { background: rgb(0 0 0 / 0.4); }
dialog h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0 0 10px; }
dialog .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 0.95rem; color: var(--muted); }
dialog textarea { width: 100%; max-height: none; }
.summary { white-space: pre-wrap; margin-top: 14px; padding: 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); overflow-wrap: anywhere; }
dialog input { font: inherit; font-size: 1rem; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
dialog .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.primary { background: var(--me); color: var(--surface); border: none; border-radius: 10px; padding: 9px 14px; font: inherit; font-weight: 700; cursor: pointer; }
#langList { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 6px; }
#langList li { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 0.85rem; display: flex; gap: 6px; align-items: center; }
#langList button { background: none; border: none; color: var(--danger); cursor: pointer; font: inherit; padding: 0; }
</style>
</head>
<body>
<header class="wrap">
  <h1>Canlı <span>Çeviri</span></h1>
  <div class="hbtns">
    <button class="icon-btn" id="smaller" type="button" aria-label="Yazıyı küçült">A−</button>
    <button class="icon-btn" id="bigger" type="button" aria-label="Yazıyı büyüt"><b>A+</b></button>
    <button class="icon-btn" id="meetBtn" type="button">Toplantı</button>
    <button class="icon-btn" id="setBtn" type="button">Ayarlar</button>
  </div>
</header>
<button type="button" id="costBar" class="wrap costbar" aria-label="Harcama ayrıntıları"></button>

<main id="feed" class="wrap" aria-live="polite"></main>

<section class="composer">
  <div class="wrap">
    <div class="langs">
      <label class="me-l" for="srcSel">Konuşan
        <select id="srcSel"></select>
      </label>
      <button class="icon-btn" id="swap" type="button" aria-label="Dilleri değiştir">⇄</button>
      <label class="them-l" for="tgtSel">Çeviri
        <select id="tgtSel"></select>
      </label>
    </div>
    <form class="inputrow" id="form">
      <button class="round" id="mic" type="button" aria-label="Mikrofonla dinle" hidden>🎤</button>
      <textarea id="text" rows="1" placeholder="Yazın veya konuşun"></textarea>
      <button class="round" id="send" type="submit" aria-label="Çevir">➤</button>
    </form>
    <p class="hint" id="hint"></p>
  </div>
</section>

<dialog id="langDlg">
  <h2>Diller</h2>
  <ul id="langList"></ul>
  <form id="addLang" method="dialog">
    <div class="row"><label for="newName">Dil adı (ör. Almanca, Japonca)</label><input id="newName" required></div>
    <div class="row"><label for="newCode">Ses kodu, isteğe bağlı (ör. de-DE, ja-JP)</label><input id="newCode" placeholder="boş bırakılabilir"></div>
    <div class="btns">
      <button type="button" class="icon-btn" id="closeDlg">Kapat</button>
      <button type="submit" class="primary">Dili ekle</button>
    </div>
  </form>
</dialog>

<dialog id="setDlg">
  <h2>Ayarlar</h2>
  <form id="setForm" method="dialog">
    <div class="row"><label for="apiKey">Claude API anahtarı (sk-ant-… ile başlar)</label><input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-..."></div>
    <div class="row"><label for="oaKey">OpenAI API anahtarı, bipsiz dinleme için (sk-… ile başlar, isteğe bağlı)</label><input id="oaKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-..."></div>
    <p class="hint">Anahtar sadece bu telefonda saklanır, başka hiçbir yere gönderilmez; yalnızca çeviri için doğrudan Claude'a gider.</p>
    <div class="btns">
      <button type="button" class="icon-btn" id="delKey">Anahtarları sil</button>
      <button type="submit" class="primary">Kaydet</button>
    </div>
  </form>
    <div class="toggles setgroup">
      <label><input type="checkbox" id="autoSpeak" checked> Çeviriyi sesli oku</label>
      <label><input type="checkbox" id="autoSend" checked> Konuşma bitince otomatik çevir</label>
      <label><input type="checkbox" id="autoTurn" checked> Karşılıklı konuşmada dili kendiliğinden değiştir</label>
      <label><input type="checkbox" id="quietMode" checked> Bip sesini azalt (sessizlikte mikrofon bekler)</label>
      <label><input type="checkbox" id="liveStt" checked> Anlık ses tanıma (daha hızlı, ses tanıma saatte yaklaşık 1 $)</label>
      <label><input type="checkbox" id="ecoMode"> Ekonomik çeviri (yaklaşık 20 kat ucuz ama zor cümlelerde hata yapabilir)</label>
    </div>
    <div class="btns setgroup">
      <button type="button" class="icon-btn" id="langBtn">Dil ekle / sil</button>
      <button type="button" class="icon-btn" id="clearBtn">Konuşmaları temizle</button>
    </div>
    <div class="btns" style="margin-top:14px"><button type="button" class="primary" id="closeSet">Kapat</button></div>
</dialog>

<dialog id="meetDlg">
  <h2>Toplantı</h2>
  <div class="row"><label for="meetInfo">Toplantının konusu, şirket ve kişi adları, özel terimler. Claude çeviride bunları kullanır.</label>
    <textarea id="meetInfo" rows="4" placeholder="Örnek: Tekstil ihracatı görüşmesi. Firmamız: Eroğlu Tekstil. Konular: fiyat teklifi, FOB teslim, numune, vade."></textarea></div>
  <div class="toggles"><label><input type="checkbox" id="formal"> Resmi dil kullan (siz, vous, Sie…)</label>
    <label><input type="checkbox" id="multi"> Çok dilli toplantı: yabancı dil kim konuşursa konuşsun Türkçeye çevrilir. Siz Türkçe konuşunca, en son konuşan kişinin diline çevrilir (aşağıdaki "Çeviri" kutusunda görünür, elle de değiştirebilirsiniz).</label></div>
  <div id="meetLangsBox" class="row" hidden><label>Toplantıda konuşulacak diller (ses tanıma sadece bunları bekler, böylece aksanlı konuşma başka dil sanılmaz):</label>
    <div id="meetLangs" class="toggles"></div></div>
  <div class="btns setgroup">
    <button type="button" class="primary" id="endMeet" style="background:#b91c1c">⏹ Toplantıyı bitir</button>
    <button type="button" class="primary" id="sumBtn">Toplantı özeti çıkar</button>
    <button type="button" class="icon-btn" id="shareBtn">Konuşmayı paylaş</button>
    <button type="button" class="icon-btn" id="newMeet">Yeni toplantı başlat</button>
  </div>
  <div id="sumOut" class="summary" hidden></div>
  <h2 style="margin-top:16px">Harcama</h2>
  <div id="costBox" class="summary"></div>
  <div class="btns" style="margin-top:14px"><button type="button" class="primary" id="closeMeet">Kapat</button></div>
</dialog>

<script>
(() => {
  // Languages: add a line here to ship a new one. "name" goes to Claude, "code" drives speech in/out.
  const BASE_LANGS = [
    { name: "Türkçe", en: "Turkish", code: "tr-TR" },
    { name: "İngilizce", en: "English", code: "en-US" },
    { name: "Fransızca", en: "French", code: "fr-FR" },
    { name: "Çince", en: "Chinese (Simplified)", code: "zh-CN" },
    { name: "Almanca", en: "German", code: "de-DE" },
    { name: "İspanyolca", en: "Spanish", code: "es-ES" },
    { name: "Arapça", en: "Arabic", code: "ar-SA" },
    { name: "Rusça", en: "Russian", code: "ru-RU" },
  ];

  const store = {
    get(k, d) { try { const v = localStorage.getItem("cc_" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("cc_" + k, JSON.stringify(v)); } catch {} },
  };

  const $ = (id) => document.getElementById(id);
  const feed = $("feed"), text = $("text"), srcSel = $("srcSel"), tgtSel = $("tgtSel"), hint = $("hint"), mic = $("mic");

  let customLangs = store.get("custom", []);
  let history = store.get("history", []);
  const langs = () => [...BASE_LANGS, ...customLangs];
  const byName = (n) => langs().find((l) => l.name === n) || { name: n, en: n, code: "" };

  // ---------- languages UI ----------
  function fillSelects() {
    const s = srcSel.value || store.get("src", "Türkçe");
    const t = tgtSel.value || store.get("tgt", "İngilizce");
    for (const sel of [srcSel, tgtSel]) {
      sel.textContent = "";
      for (const l of langs()) { const o = document.createElement("option"); o.value = l.name; o.textContent = l.name; sel.append(o); }
    }
    srcSel.value = langs().some((l) => l.name === s) ? s : "Türkçe";
    tgtSel.value = langs().some((l) => l.name === t) ? t : "İngilizce";
  }
  function saveLangs() { store.set("src", srcSel.value); store.set("tgt", tgtSel.value); if (rec) { rec.lang = byName(srcSel.value).code || "tr-TR"; if (listening) { showListening(); if (!ttsActive && recRunning) rec.stop(); } } }
  srcSel.onchange = tgtSel.onchange = () => { saveLangs(); if (cloud && !multi()) liveSession(cloud); };
  function swapLangs() { const a = srcSel.value; srcSel.value = tgtSel.value; tgtSel.value = a; saveLangs(); }
  $("swap").onclick = swapLangs;

  function renderLangList() {
    const ul = $("langList"); ul.textContent = "";
    for (const l of langs()) {
      const li = document.createElement("li"); li.textContent = l.name;
      if (customLangs.includes(l)) {
        const b = document.createElement("button"); b.type = "button"; b.textContent = "✕"; b.setAttribute("aria-label", l.name + " dilini sil");
        b.onclick = () => { customLangs = customLangs.filter((x) => x !== l); store.set("custom", customLangs); fillSelects(); renderLangList(); };
        li.append(b);
      }
      ul.append(li);
    }
  }
  $("langBtn").onclick = () => { renderLangList(); $("langDlg").showModal(); };
  $("closeDlg").onclick = () => $("langDlg").close();
  $("addLang").onsubmit = (e) => {
    e.preventDefault();
    const name = $("newName").value.trim(); if (!name) return;
    if (!langs().some((l) => l.name.toLowerCase() === name.toLowerCase())) {
      customLangs.push({ name, en: name, code: $("newCode").value.trim() });
      store.set("custom", customLangs);
    }
    $("newName").value = ""; $("newCode").value = "";
    fillSelects(); renderLangList(); tgtSel.value = name; saveLangs();
  };

  // ---------- feed ----------
  const SAMPLES = [
    { side: "me", src: "Türkçe", tgt: "İngilizce", orig: "Merhaba, en yakın eczane nerede?", tr: "Hello, where is the nearest pharmacy?", sample: true },
    { side: "them", src: "İngilizce", tgt: "Türkçe", orig: "It's two streets down, on the left.", tr: "İki sokak aşağıda, solda.", sample: true },
  ];
  function bubble(item) {
    const div = document.createElement("div");
    div.className = "bubble " + item.side;
    const meta = document.createElement("div"); meta.className = "meta";
    const who = document.createElement("b"); who.textContent = item.side === "me" ? "Ben" : "Karşı taraf";
    const dir = document.createElement("span"); dir.textContent = item.src + " → " + item.tgt;
    meta.append(who, dir);
    if (item.sample) { const t = document.createElement("span"); t.className = "sample-tag"; t.textContent = "örnek"; meta.append(t); }
    if (item.timing) { const t = document.createElement("span"); t.className = "timing"; t.textContent = "⏱ " + item.timing; meta.append(t); }
    const orig = document.createElement("div"); orig.className = "orig"; orig.textContent = item.orig;
    const tr = document.createElement("div"); tr.className = "tr";
    const warn = document.createElement("div"); warn.className = "unsure"; warn.hidden = !item.unsure;
    warn.textContent = "⚠ Ses net anlaşılmadı, bu çeviri tahmindir. Gerekirse tekrar söyletin.";
    const acts = document.createElement("div"); acts.className = "acts";
    const speakB = document.createElement("button"); speakB.type = "button"; speakB.textContent = "🔊 Oku";
    speakB.onclick = () => speak(item.tr, item.tgt);
    const copyB = document.createElement("button"); copyB.type = "button"; copyB.textContent = "Kopyala";
    copyB.onclick = () => { navigator.clipboard?.writeText(item.tr).then(() => { copyB.textContent = "Kopyalandı"; }, () => { copyB.textContent = "Kopyalanamadı"; }); };
    acts.append(speakB, copyB);
    div.append(meta, orig, tr, warn, acts);
    div._update = () => {
      tr.className = "tr" + (item.error ? " err" : item.tr ? "" : " pending");
      tr.textContent = item.error || item.tr || "Çevriliyor…";
      acts.hidden = !item.tr || !!item.error;
    };
    div._update();
    return div;
  }
  function renderFeed() {
    feed.textContent = "";
    if (!history.length) {
      const n = document.createElement("p"); n.className = "empty-note";
      // Examples only before the app is set up; once there is a key or any conversation, never again.
      const firstRun = !store.get("used", false) && !apiKey() && !oaKey();
      n.textContent = firstRun ? "Konuşmalar burada görünecek. Aşağıda iki örnek var." : "Konuşmalar burada görünecek.";
      feed.append(n);
      if (firstRun) SAMPLES.forEach((s) => feed.append(bubble(s)));
    } else history.forEach((h) => feed.append(bubble(h)));
    feed.scrollTop = feed.scrollHeight;
  }
  $("clearBtn").onclick = () => { store.set("used", true); history = []; store.set("history", history); renderFeed(); $("setDlg").close(); };
  $("ecoMode").checked = store.get("quality", "high") === "eco";
  $("ecoMode").onchange = () => store.set("quality", $("ecoMode").checked ? "eco" : "high");
  $("liveStt").checked = store.get("liveStt", true);
  $("liveStt").onchange = () => store.set("liveStt", $("liveStt").checked);
  for (const id of ["autoSpeak", "autoSend", "autoTurn", "quietMode"]) { $(id).checked = store.get(id, true); $(id).onchange = () => store.set(id, $(id).checked); }

  // ---------- translation (Claude, on the viewer's own Claude account) ----------
  // Translation engine: the user's own Claude API key if set; inside claude.ai, the viewer's Claude account.
  // Quality setting: Sonnet translates tricky sentences correctly (e.g. "Seni özledim" → "Tu me manques"); Haiku is ~20x cheaper.
  const MODELS = { high: "claude-sonnet-5-5", eco: "claude-haiku-5-5" };

  let queue = Promise.resolve();
  const apiKey = () => (store.get("apiKey", "") || "").trim();

  const PRICES = {
    "claude-sonnet-5-5": { in: 2 / 1e6, out: 10 / 1e6 },

    "gpt-4o-mini-transcribe": 0.003 / 60, "gpt-transcribe": 0.0045 / 60, "gpt-live-transcribe": 0.017 / 60, // per audio second
  };
  function addCost(provider, usd) {
    if (!(usd > 0)) return;
    for (const k of ["costs", "meetCosts"]) {
      const c = store.get(k, null) || { claude: 0, openai: 0, since: new Date().toISOString().slice(0, 10) };
      c[provider] += usd; store.set(k, c);

  }
  function renderCosts() {
    const usd = (x) => "$" + (x || 0).toFixed(x >= 1 ? 2 : 3);
    const bar = document.getElementById("costBar");
    if (bar) { const m = store.get("meetCosts", null) || { claude: 0, openai: 0 }; bar.textContent = (store.get("multi", false) ? "🌐 Çok dilli toplantı AÇIK · " : "") + `💲 Bu toplantı ${usd(m.claude + m.openai)}  (Claude ${usd(m.claude)} · OpenAI ${usd(m.openai)})`; }
    const box = document.getElementById("costBox"); if (!box) return;
    const line = (c) => `Claude ${usd(c.claude)} · OpenAI ${usd(c.openai)} · Toplam ${usd(c.claude + c.openai)}`;
    const all = store.get("costs", null) || { claude: 0, openai: 0, since: "" }, meet = store.get("meetCosts", null) || { claude: 0, openai: 0 };
    box.textContent = `Bu toplantı: ${line(meet)}\nTümü${all.since ? " (" + all.since.split("-").reverse().join(".") + " tarihinden beri)" : ""}: ${line(all)}\nTahminidir. Kesin tutar Claude ve OpenAI hesaplarınızın Billing sayfasındadır.`;

  const oaKey = () => (store.get("oaKey", "") || "").trim();

  async function askClaude(p, onText) {
    const key = apiKey();

      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2026-10-21",
          "anthropic-dangerous-direct-browser-access": "true",

          else if (ev.type === "error") throw fail(ev.error?.type === "overloaded_error" ? 429 : 500, ev.error?.message);
        }
      }
      const pr = PRICES[usedModel]; if (pr) addCost("claude", inTok * pr.in + outTok * pr.out);
      if (stop === "refusal") throw { code: "api", message: "Claude bu metni çevirmeyi reddetti." };
      return out.trim();
    }
    const sample = await samplePromise;
    if (!sample) throw { code: "no_key" };
    const res = await sample(p, { modelTier: "quick", onText: ({ text: t }) => onText(t) });
    return res.text.trim();
  }

  // Two-way prompt: Claude decides which of the two selected languages the text is in and translates into the other.
  function prompt(srcL, tgtL, t, context) {
    const info = (store.get("meetInfo", "") || "").trim();
    const recent = context.map((h) => `- (${h.src}) ${h.orig}\n  → (${h.tgt}) ${h.tr}`).join("\n");
    return `You are a professional live interpreter in a two-way conversation between ${srcL.en} and ${tgtL.en}${info ? ", for example in a business meeting" : ""}.
The text below is most likely ${srcL.en}, but it may be ${tgtL.en}. Decide which of the two it is, then translate it into the other one.
The text may come from speech recognition, so fix obvious recognition mistakes and missing punctuation silently, using the conversation so far and the meeting notes to work out what was meant.
Keep the meaning, tone and register; translate naturally as a native speaker would say it. Keep names, numbers, prices, dates and units exact.
Be careful about who does what to whom: keep subject and object roles exactly as in the original, including with verbs whose roles flip between languages.
Use the same translation for a term every time it comes up in this conversation.
${store.get("formal", false) ? "Use formal, polite address in the translation (for example siz in Turkish, vous in French, Sie in German, usted in Spanish).\n" : ""}${info ? `\nMeeting notes from the user (topic, names, special terms):\n${info}\n` : ""}${recent ? `\nConversation so far, for context only (do not translate it again):\n${recent}\n` : ""}
If the recognized text is too garbled to be sure what was said and you had to guess, still give your best translation but add "unsure": true.
Reply with JSON only, no other text: {"from": "${srcL.en}" or "${tgtL.en}", "translation": "...", "unsure": false}

Text to translate now:
${t}`;
  }
  // Many-language meeting: the user speaks Turkish; anyone else may speak any language.
  function promptMulti(tgtL, t, context) {

    return `You are a professional live interpreter in a business meeting where several languages are spoken. The user speaks Turkish; the other participants speak ${meetLangs().filter((l) => l.name !== "Türkçe").map((l) => l.en).join(", ") || "other languages"}, possibly with a strong accent.
First decide which language the text below is in. Speech recognition may have garbled accented speech; if the text looks like a mix, work out what the speaker most likely said in one of the meeting languages. If it is Turkish, translate it into ${tgtL.en}. If it is any other language, translate it into Turkish.
The text may come from speech recognition, so fix obvious recognition mistakes and missing punctuation silently, using the conversation so far and the meeting notes to work out what was meant.
Keep the meaning, tone and register; translate naturally as a native speaker would say it. Keep names, numbers, prices, dates and units exact.
Be careful about who does what to whom: keep subject and object roles exactly as in the original, including with verbs whose roles flip between languages.
Use the same translation for a term every time it comes up in this conversation.
${store.get("formal", false) ? "Use formal, polite address in the translation (for example siz in Turkish, vous in French, Sie in German, usted in Spanish).\n" : ""}${info ? `\nMeeting notes from the user (topic, names, special terms):\n${info}\n` : ""}${recent ? `\nConversation so far, for context only (do not translate it again):\n${recent}\n` : ""}
If the recognized text is too garbled to be sure what was said and you had to guess, still give your best translation but add "unsure": true.
Reply with JSON only, no other text: {"from": "<English name of the text's language>", "fromCode": "<its BCP-47 code, e.g. fr-FR>", "translation": "...", "unsure": false}

Text to translate now:
${t}`;
  }
  function findLang(en, code) {
    const l = langs().find((x) => x.en.toLowerCase() === (en || "").toLowerCase())

  function translate(orig, fromSpeech = false, t0 = Date.now(), sttMs = 0) {
    orig = orig.trim(); if (!orig) return;
    if (!history.length) feed.textContent = "";

        const sec = (ms) => (ms / 1000).toFixed(1);
        item.timing = (sttMs ? "ses→yazı " + sec(sttMs) + " · " : "") + "çeviri " + sec(Date.now() - tTr) + " · toplam " + sec(Date.now() - t0) + " sn";
        item.side = isMulti ? (res.from.name === "Türkçe" ? "me" : "them") : res.from.name === "Türkçe" || (res.to.name !== "Türkçe" && res.from === srcL) ? "me" : "them";

  }

  // ---------- meeting ----------
  $("meetBtn").onclick = () => { renderCosts(); renderMeetLangs(); $("meetInfo").value = store.get("meetInfo", ""); $("formal").checked = store.get("formal", false); $("meetDlg").showModal(); };
  $("costBar").onclick = () => $("meetBtn").click(); renderCosts();
  $("meetInfo").oninput = () => store.set("meetInfo", $("meetInfo").value);

    .map((h) => `${h.side === "me" ? "Ben" : "Karşı taraf"} (${h.src}): ${h.orig}\n→ (${h.tgt}): ${h.tr}`).join("\n\n");

    delete btn.dataset.armed; btn.textContent = "Yeni toplantı başlat";

  $("endMeet").onclick = async () => {
    const btn = $("endMeet");

  $("sumBtn").onclick = async () => {

Write a summary in Turkish for the user, in plain text without markdown symbols, with these headings:
Özet: (3-5 sentences)
Alınan kararlar: (bullet lines starting with "• ", or "Yok")
Yapılacaklar: (bullet lines starting with "• ", with who does it if known, or "Yok")
Önemli rakamlar ve tarihler: (bullet lines, or "Yok")

Transcript:
${t}`, (p) => { out.textContent = p; });

    }
  };

  // ---------- settings ----------
  $("setBtn").onclick = () => { $("apiKey").value = apiKey(); $("oaKey").value = oaKey(); $("setDlg").showModal(); };
  $("setForm").onsubmit = (e) => {
    e.preventDefault();
    store.set("apiKey", $("apiKey").value.trim()); store.set("oaKey", $("oaKey").value.trim());
    $("setDlg").close(); updateKeyHint(); idleHint();
  };
  $("closeSet").onclick = () => $("setDlg").close();
  $("delKey").onclick = () => { store.set("apiKey", ""); store.set("oaKey", ""); $("apiKey").value = ""; $("oaKey").value = ""; updateKeyHint(); idleHint(); };
  function updateKeyHint() { $("setBtn").textContent = apiKey() ? "Ayarlar" : "Ayarlar ⚠"; }

  $("form").onsubmit = (e) => { e.preventDefault(); clearTimeout(autoTimer); const t = text.value; text.value = ""; store.set("draft", ""); autoGrow(); translate(t); };
  text.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });

  // Keyboard dictation: when the text stops changing for a moment, translate it.
  let autoTimer;
  function autoGrow() { text.style.height = "auto"; text.style.height = Math.min(text.scrollHeight, 8 * parseFloat(getComputedStyle(document.documentElement).fontSize)) + "px"; }
  text.addEventListener("input", () => {
    autoGrow(); store.set("draft", text.value);
    clearTimeout(autoTimer);

    if (mic.hidden && $("autoSend").checked && text.value.trim()) autoTimer = setTimeout(() => $("form").requestSubmit(), 1800);
  });

  // ---------- speech out ----------
  function speak(t, langName) {
    if (!("speechSynthesis" in window) || !t) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);
      const code = byName(langName).code; if (code) u.lang = code;
      const v = speechSynthesis.getVoices().find((v) => code && v.lang.replace("_", "-").toLowerCase().startsWith(code.slice(0, 2).toLowerCase()));

      if (listening || cloudOn) { ttsActive = true; if (recRunning) { try { rec.abort(); } catch {} } }
      u.onend = u.onerror = () => { ttsActive = false; ttsEndedAt = Date.now(); if (listening) startRec(); };
      speechSynthesis.speak(u);
    } catch {}
  }

  // ---------- speech in (browser speech recognition, where the page is allowed the mic) ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, ttsActive = false, wakeLock = null, recRunning = false, heard = false, audioCtx = null;
  let browserMicClick = null, ttsEndedAt = 0;

  // ---------- bipsiz dinleme: own microphone capture + OpenAI transcription ----------

  const canRecord = !!(navigator.mediaDevices?.getUserMedia);
  // Fast mode uses the lighter transcription model; "accurate" uses OpenAI's newest one, which took ~2 s per sentence in testing.
  // The light model cannot be told which languages to expect and then guesses (English heard as French or Thai),
  // so file transcription always uses the model that accepts language hints.
  const sttModel = () => "gpt-transcribe";
  const HALLUCINATIONS = /altyaz|abone ol|thank(s)? for watching|sous-titr|subt[ií]tulos|untertitel|字幕|konuşma .* dilinde|speech in \w+ or \w+/i;
  let cloudOn = false, cloud = null, sttQueue = Promise.resolve(), sttPending = 0;

  function encodeWav(chunks, rate) {

    w(0, "RIFF"); v.setUint32(4, 36 + len * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);

  async function transcribe(blob) {
    const fd = new FormData();
    fd.append("file", blob, "speech.wav");
    const m = sttModel(); fd.append("model", m);
    const audioSec = (blob.size - 44) / 2 / 16000;
    if (m === "gpt-transcribe") for (const c of sttLangs()) fd.append("languages[]", c);
    // No prompt hint here: on near-silent audio the light model echoes the hint back as if it were speech.
    const r = await fetch("https://api.openai.com/v1/audio/transcriptions", { method: "POST", headers: { Authorization: "Bearer " + oaKey() }, body: fd });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const m = data?.error?.message || ("HTTP " + r.status);
      throw { code: r.status === 401 ? "oa_bad_key" : /quota|billing|credit/i.test(m) ? "oa_no_credit" : r.status === 429 ? "rate_limited" : "oa", message: m };
    }
    addCost("openai", audioSec * (PRICES[m] || 0));
    return (data.text || "").trim();
  }

  function sendSegment(chunks, rate) {
    const blob = encodeWav(chunks, rate);
    sttPending++; showCloudHint();
    const tCut = Date.now();
    sttQueue = sttQueue.then(async () => {
      try {
        const tStart = Date.now();
        const t = await transcribe(blob);
        if (t && !HALLUCINATIONS.test(t) && /[\p{L}\p{N}]/u.test(t)) translate(t, true, tCut, Date.now() - tStart);
      } catch (e) {
        const msg = { oa_bad_key: "OpenAI anahtarı geçersiz. Ayarlar'dan kontrol edin.", oa_no_credit: "OpenAI hesabında bakiye yok. platform.openai.com > Billing bölümünden yükleyin.", rate_limited: "Çok hızlı istek gönderildi, biraz bekleyin." }[e?.code]
          || (e instanceof TypeError ? "İnternet bağlantısı yok ya da OpenAI'ye ulaşılamadı." : "Ses yazıya çevrilemedi: " + (e?.message || "bilinmeyen hata"));
        hint.className = "hint warn"; hint.textContent = msg;
        if (e?.code === "oa_bad_key" || e?.code === "oa_no_credit") stopCloud(true);
      } finally { sttPending--; showCloudHint(); }
    });
  }

  function showCloudHint() {
    if (!cloudOn || hint.className.includes("warn")) return;
    hint.className = "hint listening";
    hint.textContent = cloud?.speaking ? "🔴 Konuşma kaydediliyor…" : sttPending ? "⏳ Ses yazıya çevriliyor…" : "🎤 Dinliyorum" + (cloud?.ws && cloud.wsReady ? " ⚡ anlık" : "") + ". Konuşun, susunca çevrilir.";
    if (!cloud?.speaking && !sttPending) hint.textContent += " Dinlenen diller: " + sttLangs().join(", ").toUpperCase();
  }

  // Live transcription: audio is streamed to OpenAI while you speak, so the text is ready almost as soon as you stop.
  // Uses the browser WebSocket sub-protocol login; the key never leaves this phone except to OpenAI itself.
  const LIVE_MODEL = "gpt-live-transcribe";
  function b64pcm(f32) {
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) { const x = Math.max(-1, Math.min(1, f32[i])); i16[i] = x < 0 ? x * 0x8000 : x * 0x7fff; }
    const u8 = new Uint8Array(i16.buffer); let bin = "";
    for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  // Languages the speech recognizer should expect. Two-way: the two selected ones. Multi: every language in the list,
  // so accented speech is not mistaken for a language nobody in the meeting speaks (e.g. accented French heard as Arabic).
  function sttLangs() {
    const names = multi() ? meetLangs().map((l) => l.name) : [srcSel.value, tgtSel.value];
    return [...new Set(names.map((n) => (byName(n).code || "").slice(0, 2).toLowerCase()).filter(Boolean))];
  }
  function liveSession(c) {
    if (!c?.ws || c.ws.readyState !== 1) return;
    const langs = sttLangs();
    c.ws.send(JSON.stringify({ type: "session.update", session: { type: "transcription", audio: { input: {
      format: { type: "audio/pcm", rate: 24000 },
      transcription: { model: LIVE_MODEL, ...(langs.length ? { languages: langs } : {}) },
      turn_detection: null,
    } } } }));
  }
  function openLive(c) {
    let ws;
    try { ws = new WebSocket("wss://api.openai.com/v1/realtime?intent=transcription", ["realtime", "openai-insecure-api-key." + oaKey()]); }
    catch { return; }
    c.ws = ws; c.wsReady = false; c.pending = []; c.partial = {};
    ws.onopen = () => {
      liveSession(c);
      c.wsReady = true; showCloudHint();
    };
    ws.onmessage = (m) => {
      let ev; try { ev = JSON.parse(m.data); } catch { return; }
      if (ev.type === "conversation.item.input_audio_transcription.delta") {
        c.partial[ev.item_id] = (c.partial[ev.item_id] || "") + (ev.delta || "");
        text.value = c.partial[ev.item_id]; autoGrow();
      } else if (ev.type === "conversation.item.input_audio_transcription.completed") {
        const job = c.pending.shift() || { tCut: Date.now(), tCommit: Date.now() };
        delete c.partial[ev.item_id]; text.value = ""; autoGrow();
        sttPending = Math.max(0, sttPending - 1); showCloudHint();
        const t = (ev.transcript || "").trim();
        if (t && !HALLUCINATIONS.test(t) && /[\p{L}\p{N}]/u.test(t)) translate(t, true, job.tCut, Date.now() - job.tCommit);
      } else if (ev.type === "error") {
        if (/empty|too small|buffer/i.test(ev.error?.code || ev.error?.message || "")) { if (c.pending.length) { c.pending.shift(); sttPending = Math.max(0, sttPending - 1); showCloudHint(); } return; }
        liveFailed(c, ev.error?.message || ev.error?.code);
      }
    };
    ws.onerror = () => liveFailed(c);
    ws.onclose = () => { if (cloud === c && c.ws === ws) liveFailed(c); };
  }
  function liveFailed(c, why) {
    if (!c.ws) return;
    const ws = c.ws; c.ws = null; c.wsReady = false; try { ws.close(); } catch {}
    sttPending = Math.max(0, sttPending - c.pending.length); c.pending = [];
    if (cloud === c) { hint.className = "hint warn"; hint.textContent = "Anlık ses tanımaya bağlanılamadı" + (why ? " (" + why + ")" : "") + ". Normal moda geçildi, çalışmaya devam ediyor."; setTimeout(() => { if (hint.className.includes("warn")) { hint.className = "hint"; showCloudHint(); } }, 6000); }
  }

  async function startCloud() {
    let stream;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch {
      hint.className = "hint warn"; hint.textContent = "Mikrofon açılamadı. Telefon ayarlarından bu uygulamaya mikrofon izni verin.";
      return;
    }
    cloudOn = true; mic.classList.add("on"); keepAwake(true);
    const rate = audioCtx.sampleRate, OUT = 16000;
    const src = audioCtx.createMediaStreamSource(stream);
    const proc = audioCtx.createScriptProcessor(4096, 1, 1);
    const mute = audioCtx.createGain(); mute.gain.value = 0;
    src.connect(proc); proc.connect(mute); mute.connect(audioCtx.destination);
    const blockMs = 4096 / rate * 1000;
    cloud = { stream, src, proc, mute, speaking: false, chunks: [], preroll: [], preroll24: [], floor: 0, calib: 0, loud: 0, quietMs: 0, speechMs: 0, ws: null, wsReady: false, live: false, liveSamples: 0 };
    if (store.get("liveStt", true)) openLive(cloud);
    const appendLive = (c, f32) => { c.ws.send(JSON.stringify({ type: "input_audio_buffer.append", audio: b64pcm(f32) })); c.liveSamples += f32.length; };
    proc.onaudioprocess = (ev) => {
      const c = cloud; if (!c) return;
      const data = ev.inputBuffer.getChannelData(0);
      // While the app is reading a translation aloud (and just after), ignore the microphone so it does not hear itself.
      if (ttsActive || Date.now() - ttsEndedAt < 400) {
        if (c.speaking) { c.speaking = false; c.chunks = []; if (c.live && c.wsReady) c.ws.send(JSON.stringify({ type: "input_audio_buffer.clear" })); c.live = false; }
        c.preroll = []; c.preroll24 = []; return;
      }
      let sum = 0; for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
      const rms = Math.sqrt(sum / data.length);
      const pcm = downsample(data, rate, OUT), pcm24 = c.ws ? downsample(data, rate, 24000) : null;
      if (c.calib < 5) { c.floor = Math.max(c.floor, rms); c.calib++; return; }
      const thr = Math.max(0.012, c.floor * 2.5);
      if (!c.speaking) {
        c.preroll.push(pcm); if (c.preroll.length > 3) c.preroll.shift();
        if (pcm24) { c.preroll24.push(pcm24); if (c.preroll24.length > 3) c.preroll24.shift(); }
        c.loud = rms > thr ? c.loud + 1 : 0;
        if (rms < thr) c.floor = c.floor * 0.95 + rms * 0.05; // follow slowly changing background noise
        if (c.loud >= 1) {
          c.speaking = true; c.chunks = [...c.preroll]; c.preroll = []; c.quietMs = 0; c.speechMs = 0;
          c.live = !!(c.ws && c.wsReady && c.ws.readyState === 1);
          if (c.live) { c.liveSamples = 0; c.preroll24.forEach((x) => appendLive(c, x)); }
          c.preroll24 = []; showCloudHint();
        }
        return;
      }
      c.chunks.push(pcm); c.speechMs += blockMs;
      if (c.live) { if (c.ws && c.ws.readyState === 1) appendLive(c, pcm24); else c.live = false; }
      c.quietMs = rms < thr ? c.quietMs + blockMs : 0;
      if (c.quietMs >= 500 || c.speechMs >= 25000) {
        const chunks = c.chunks; c.speaking = false; c.chunks = [];
        const real = c.speechMs - c.quietMs >= 300;
        if (c.live && c.ws && c.ws.readyState === 1) {
          if (real) {
            c.ws.send(JSON.stringify({ type: "input_audio_buffer.commit" }));
            c.pending.push({ tCut: Date.now(), tCommit: Date.now() }); sttPending++;
            addCost("openai", c.liveSamples / 24000 * PRICES[LIVE_MODEL]);
          } else c.ws.send(JSON.stringify({ type: "input_audio_buffer.clear" }));
        } else if (real) sendSegment(chunks, OUT);
        c.live = false;
        showCloudHint();
      }
    };
    showCloudHint();
  }

  function stopCloud(keepHint = false) {
    const c = cloud; cloud = null; cloudOn = false;
    if (c?.ws) {
      // Finish the sentence being spoken, then close once its text has arrived (at most 6 s).
      if (c.speaking && c.live && c.ws.readyState === 1 && c.speechMs >= 300) {
        c.ws.send(JSON.stringify({ type: "input_audio_buffer.commit" }));
        c.pending.push({ tCut: Date.now(), tCommit: Date.now() }); sttPending++; showCloudHint();
        addCost("openai", c.liveSamples / 24000 * PRICES[LIVE_MODEL]);
      }
      const ws = c.ws, t0 = Date.now();
      const tryClose = () => {
        if (c.pending.length && Date.now() - t0 < 6000) return setTimeout(tryClose, 200);
        sttPending = Math.max(0, sttPending - c.pending.length); c.pending = []; c.ws = null;
        try { ws.close(); } catch {}
      };
      tryClose();
    }
    if (c) { c.proc.onaudioprocess = null; try { c.src.disconnect(); c.proc.disconnect(); c.mute.disconnect(); } catch {} c.stream.getTracks().forEach((t) => t.stop()); }
    mic.classList.remove("on"); keepAwake(false);
    if (!keepHint) idleHint();
  }
  function startRec() { if (rec && listening && !recRunning && !ttsActive) { try { rec.start(); } catch {} } }

  // Quiet mode: Android beeps every time recognition (re)starts, and it stops by itself after a few seconds of silence.
  // Instead of restarting straight away, wait silently on the microphone until someone speaks, then restart once.
  function waitForVoice() {
    return new Promise(async (resolve) => {
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.resume();
      } catch { stream?.getTracks().forEach((t) => t.stop()); resolve(); return; }
      const src = audioCtx.createMediaStreamSource(stream), an = audioCtx.createAnalyser();
      an.fftSize = 1024; src.connect(an);
      const buf = new Float32Array(an.fftSize);
      let ticks = 0, floor = 0, loud = 0;
      const done = () => { clearInterval(iv); src.disconnect(); stream.getTracks().forEach((t) => t.stop()); resolve(); };
      const iv = setInterval(() => {
        if (!listening || ttsActive) return done();
        an.getFloatTimeDomainData(buf);
        let sum = 0; for (const x of buf) sum += x * x;
        const rms = Math.sqrt(sum / buf.length);
        ticks++;
        if (ticks <= 8) { floor = Math.max(floor, rms); return; }
        loud = rms > Math.max(0.02, floor * 2.5) ? loud + 1 : 0;
        if (loud >= 2) done();
      }, 50);
    });
  }
  async function keepAwake(on) {
    try {
      if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
      else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch {}
  }
  document.addEventListener("visibilitychange", () => { if (listening && document.visibilityState === "visible") keepAwake(true); });
  const DICTATION_HINT = "Konuşmak için yazı kutusuna dokunun ve telefon klavyesindeki 🎤 tuşuna basın. Siz durunca çeviri kendiliğinden yapılır.";
  if (SR) {
    rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = byName(store.get("src", "Türkçe")).code || "tr-TR";
    // Android Chrome re-sends the whole utterance so far as each new result ("onu", "onu hemen", "onu hemen ara"),
    // while other browsers send separate pieces. merge() handles both: a longer repeat replaces, a new piece appends.
    const norm = (x) => x.toLowerCase().replace(/\s+/g, " ").trim();
    function merge(acc, next) {
      next = next.trim();
      if (!next) return acc;
      if (!acc) return next;
      if (norm(next).startsWith(norm(acc))) return next;
      if (norm(acc).endsWith(norm(next)) || norm(acc).startsWith(norm(next))) return acc;
      return acc + " " + next;
    }
    let committed = "", sessionText = "", consumed = "", turnTimer;
    const current = () => {
      let t = sessionText;
      if (consumed && norm(t).startsWith(norm(consumed))) t = t.slice(consumed.length).trim();
      else if (consumed && norm(consumed).startsWith(norm(t))) t = "";
      return merge(committed, t);
    };
    const flushTurn = () => {
      clearTimeout(turnTimer);
      const t = current();
      committed = ""; consumed = sessionText;
      text.value = ""; autoGrow();
      translate(t, true);
    };
    rec.onstart = () => { recRunning = true; heard = false; committed = current(); sessionText = ""; consumed = ""; };
    rec.onresult = (e) => {
      heard = true;
      let finals = "", interim = "";
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i], t = r[0].transcript;
        if (r.isFinal) finals = merge(finals, t); else interim = merge(interim, t);
      }
      sessionText = finals;
      const now = current();
      let tail = interim;
      if (tail && norm(tail).startsWith(norm(finals))) tail = tail.trim().slice(finals.length).trim();
      text.value = (now + " " + tail).trim();
      autoGrow();
      clearTimeout(turnTimer);
      if (now && !tail) turnTimer = setTimeout(flushTurn, 1200);
    };
    rec.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
        listening = false; mic.classList.remove("on"); mic.hidden = true;
        hint.className = "hint warn"; hint.textContent = "Bu ekranda mikrofon açılamadı. " + DICTATION_HINT;
      }
    };
    rec.onend = () => {
      recRunning = false;
      if (!listening) { mic.classList.remove("on"); return; }
      if (ttsActive) return; // restarted when speaking ends
      if (heard || !$("quietMode").checked) setTimeout(startRec, 150);
      else waitForVoice().then(startRec);
    };
    browserMicClick = () => {
      if (listening) { listening = false; rec.stop(); keepAwake(false); mic.classList.remove("on"); hint.className = "hint"; hint.textContent = ""; return; }
      listening = true; mic.classList.add("on"); keepAwake(true);
      try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
      startRec(); showListening();
    };
  }
  function showListening() {
    hint.className = "hint listening";
    hint.textContent = "🎤 Şimdi dinlenen dil: " + srcSel.value + ". Yanlışsa ⇄ tuşuna basın.";
  }
  function idleHint() {
    mic.hidden = !(SR || (oaKey() && canRecord));
    if (listening || cloudOn) return;
    hint.className = "hint";
    hint.textContent = oaKey() && canRecord ? "Bipsiz dinleme hazır. Başlamak için 🎤 tuşuna basın."
      : SR ? "Sürekli dinlemek için 🎤 tuşuna basın." : DICTATION_HINT;
  }
  mic.onclick = () => {
    if (cloudOn) return stopCloud();
    if (listening) return browserMicClick();
    if (oaKey() && canRecord) return startCloud();
    if (browserMicClick) browserMicClick();
  };
  idleHint();

  // Text size: A− / A+ in the header, remembered on this phone.
  let scale = store.get("scale", 1);
  // Some phones (e.g. a folded Galaxy Fold cover screen in "desktop site" mode) lay the page out ~980 px wide and shrink it,
  // so everything looks tiny. Detect that and scale up to the real screen width.
  function fit() { const f = innerWidth / (screen.width || innerWidth); return f > 1.25 ? Math.min(f, 4) : 1; }
  function applyScale() { document.documentElement.style.setProperty("--scale", scale); document.documentElement.style.setProperty("--fit", fit()); store.set("scale", scale); autoGrow(); }
  addEventListener("resize", () => applyScale());
  $("bigger").onclick = () => { scale = Math.min(1.8, Math.round((scale + 0.1) * 10) / 10); applyScale(); };
  $("smaller").onclick = () => { scale = Math.max(0.7, Math.round((scale - 0.1) * 10) / 10); applyScale(); };
  applyScale();

  fillSelects(); saveLangs(); updateKeyHint();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  text.value = store.get("draft", ""); autoGrow();
  renderFeed();
})();
</script>
</body>
</html>
